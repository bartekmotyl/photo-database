[project]
name = "photo-labeler"
version = "0.1.0"
description = "AI labeling tool for PhotoDB - describes photos and assigns tags using a vision LLM"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.60",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.scripts]
photo-labeler = "photo_labeler.main:main"
photo-scorer = "photo_labeler.scorer:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "types-PyYAML",
    "types-requests",
]
# Only needed for photo-scorer (pulls in torch): uv sync --group scoring
scoring = [
    "aesthetic-predictor-v2-5>=0.1",
    "pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["photo_labeler*"]

[tool.mypy]
strict = true
files = ["photo_labeler"]

[[tool.mypy.overrides]]
module = ["aesthetic_predictor_v2_5.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
