# PhotoDB AI labeler configuration.
# API keys are never stored here - set ANTHROPIC_API_KEY / OPENAI_API_KEY
# in the environment instead. Ollama needs no key.

api:
  # PhotoDB Web API base URL
  base_url: http://localhost:5284

provider:
  # Any vision model supported by LiteLLM, prefixed with the provider:
  # anthropic/claude-opus-5, openai/gpt-5.2, ollama/qwen2.5vl, gemini/gemini-2.5-pro, ...
  model: anthropic/claude-opus-5
  # Only needed for self-hosted endpoints (e.g. a non-default Ollama address).
  # base_url: http://localhost:11434

# The free-form part of the prompt sent together with each photo.
# The instructions describing the expected JSON output are fixed in code.
prompt_file: prompt.md

# Predefined tags the model may choose from (name + short description each).
tags_file: tags.yaml

labeling:
  # Photos are processed ordered by referenceDate, then id.
  # Every successfully labelled photo gets the marker tag, and photos
  # carrying it are skipped in regular runs - so interrupted runs can simply
  # be restarted. Override with --relabel to re-label marked photos.
  # Set marker_tag to "" to use "has a description" as the skip marker instead.
  skip_labelled: true
  marker_tag: ai-labeled
  # Maximum number of photos to process in one run; 0 = no limit.
  # Handy for cheap experiments with big models (also see --limit).
  limit: 0
